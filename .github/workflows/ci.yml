name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # A newer push to a pull request cancels its run in progress. Runs on main
  # always finish, so every commit there gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate PGSO corpus classification
        run: |
          python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list
          python3 -m unittest scripts.pgso.tests.test_corpus

      - name: Check public surface
        run: ./scripts/check-public-surface.sh

      - name: Check compactor boundary
        run: ./scripts/check-compactor-boundary.sh

      - name: Check indexer boundary
        run: ./scripts/check-indexer-boundary.sh

      - name: Check agents boundary
        run: ./scripts/check-agents-boundary.sh

      - name: Check recovery boundary
        run: ./scripts/check-recovery-boundary.sh

      - name: Check CLI shape
        run: python3 -m scripts.check_cli_shape

      - name: Shellcheck
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-agents-boundary.sh
            scripts/check-compactor-boundary.sh
            scripts/check-indexer-boundary.sh
            scripts/check-public-surface.sh
            scripts/check-recovery-boundary.sh
            scripts/detect-ci-need.sh
            scripts/detect-macos-need.sh
            scripts/smoke-binary.sh
            tests/e2e/ci-run-files.sh
          )
          # bash -n parses only its first argument, so check each script.
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"

      - name: Model-check request recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jar="$RUNNER_TEMP/tla2tools.jar"
          # The API download keeps working when release-asset links return 504.
          gh release download v1.7.4 -R tlaplus/tlaplus -p tla2tools.jar -O "$jar" \
            || curl -fsSL --retry 3 --retry-all-errors -o "$jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $jar" | sha256sum -c -
          TLA2TOOLS_JAR="$jar" tests/tla/recovery/check.sh

      - name: Model-check the empty-reply nudge
        run: TLA2TOOLS_JAR="$RUNNER_TEMP/tla2tools.jar" tests/tla/agent_runtime/check.sh

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # Every root E2E file needs a shard weight, and every file that branches
      # on the platform needs an entry in macos-platform-tests.json.
      - name: Check E2E shard weights
        working-directory: tests/e2e
        run: bun test ci-shards.test.ts

  test:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.0"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # Shell parity tests compare sh, dash, bash and zsh. Ubuntu's global
      # zshrc runs compinit, which aborts in a zsh with no terminal, so the
      # step turns it off.
      - name: Install zsh
        run: |
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv >/dev/null

      - name: Format
        run: zig fmt --check src/

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Unit tests
        env:
          LIA_TEST_SHELL_PARITY_ALL_SHELLS: "1"
        run: timeout 2700s zig build test -Doptimize=ReleaseSafe --summary all

      # The job passes no AI_GATEWAY_API_KEY, so the live-model cases skip.
      - name: ACP end-to-end tests
        working-directory: tests/e2e
        run: bun test acp.test.ts
