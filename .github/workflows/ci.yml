name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.17.0"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Shell parity tests compare sh, dash, bash and zsh.
      - name: Install zsh
        run: |
          command -v zsh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zsh; }
          echo 'skip_global_compinit=1' | sudo tee -a /etc/zsh/zshenv >/dev/null

      - name: Format
        run: zig fmt --check src/

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Unit tests
        env:
          FX_TEST_SHELL_PARITY_ALL_SHELLS: "1"
        run: timeout 2700s zig build test -Doptimize=ReleaseSafe --summary all

      # Without AI_GATEWAY_API_KEY the live-model cases skip.
      - name: ACP end-to-end tests
        working-directory: tests/e2e
        run: bun test acp.test.ts
